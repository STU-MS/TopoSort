name: Deliverables

# T16（Issue #31 / 方案见 evidence/decisions/2026-09-25-doc转PDF方案.md）：
# 在 CI 上把交付文档转 PDF，组装 group01.zip，手动触发时留存 artifact、
# 打 tag 时把 zip 发布到 GitHub Release。
#
# 为什么单独一个 workflow、而不是塞进 ci.yml / release.yml：
#   ci.yml 管“代码对不对”（契约测试/机械红线），release.yml 管“三端二进制产物”。
#   本文件管的是“文档交付包”，触发条件与权限需求都不同，且换行/字体依赖重、
#   跑得慢，不该拖累每个 PR 的 CI。
#
# 为什么用 `python3` 直接跑、不 `uv sync`：
#   tools/make_pdf.py / build_minutes.py / minutes_html.py / package_deliverables.py
#   都只用标准库，pandoc/Chrome 是本机外部工具（非仓库依赖，见上述决策）。
#   走 uv 只会白等 PySide6 安装。
#
# 为什么用 runner 自带的 gh CLI、而不是第三方 release Action：
#   AGENTS.md 规定新增依赖须先讨论留档；gh 已预装、actions/checkout 与
#   actions/upload-artifact 均为 GitHub 官方 Action，等于零新增仓库依赖。
#
# ⚠️ 演示视频已入库（git LFS，见 .gitattributes）；完整提交包（含视频 + 三端二进制）
#    由 release.yml 的 package job 在打 tag 时组装发布；本 workflow 保留用于：
#    ① 手动预演文档流水线（workflow_dispatch，不建 Release）；
#    ② 打 tag 时的 PDF/docx 转换验证（构建报告/会议记录/个人感想等文档产物）。
#    注意：本 workflow 产出的 group01.zip **不含三端二进制**（注入在 release.yml），
#    且不再上传 Release（避免与 release.yml 争传同名资产，v1.0.0 曾因此冲突）。

on:
  # 手动触发：在打 tag 之前先验证文档能否在干净 ubuntu runner 上转出 PDF（不建 Release）
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: "转 PDF + 组装 group01.zip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 预装 Google Chrome（命令名 google-chrome，make_pdf.py 的
      # CHROME_NAMES 已含它），无需额外安装浏览器。
      #
      # fonts-noto-cjk 必装：runner 默认没有中文字体，缺了它 PDF 中文会变成豆腐块
      # （□□□），且不会报错——只会静默产出坏 PDF。make_pdf.py 的 CSS 字体栈里
      # 已含 "Noto Sans CJK SC"，装包即可命中。
      - name: 安装 pandoc 与中文字体
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: 环境自检（pandoc / Chrome / 版本）
        run: |
          set -euo pipefail
          pandoc --version | head -n 1
          google-chrome --version
          fc-list :lang=zh | head -n 3

      # 会议记录（5 份）：docx 走「在老师下发的会议记录模板上原地填内容」，
      # PDF 走同版式 HTML + Chrome 打印。模板副本 minutes/template.docx 已入库，
      # 因此 runner 上不需要 ONLYOFFICE / x2t。
      # 必须排在 make_pdf.py 之前：make_pdf.py 已不再处理 minutes/*.md。
      - name: 生成会议记录（老师模板 docx + 同版式 PDF）
        run: |
          set -euo pipefail
          python3 tools/build_minutes.py
          python3 tools/minutes_html.py

      # CI=true 由 GitHub Actions 默认设置；make_pdf.py 检测到它会给 Chrome 追加
      # --no-sandbox，否则 runner 上的 Chrome 会因 sandbox 不可用直接拒绝启动。
      - name: 转 PDF / docx（tools/make_pdf.py）
        run: python3 tools/make_pdf.py

      # package_deliverables.py 会自动先跑 build_submission.py 刷新 submission/
      # （会议记录/个人感想的 docx+pdf 从这里复制），因此本步骤之前必须先跑 make_pdf.py。
      - name: 组装交付包（tools/package_deliverables.py）
        run: python3 tools/package_deliverables.py

      - name: 生成校验和
        run: |
          set -euo pipefail
          sha256sum group01.zip > group01.zip.sha256
          cat group01.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: group01-deliverables
          path: |
            group01.zip
            group01.zip.sha256
          # 产物缺失即失败：宁可红，也不要发出一个不完整的交付包
          if-no-files-found: error
          # 交付包偏大且下载不频繁，保留 14 天便于人工取件
          retention-days: 14

